spring.application.name=fintech-core-api

# Configuracoes de Conexao com o PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5435/fintech_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Geracao e Atualizacao Automatica de Tabelas via Hibernate
spring.jpa.hibernate.ddl-auto=update

# Dialeto e Formatacao de Logs SQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.format_sql=true
